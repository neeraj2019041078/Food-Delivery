name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test-server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm test
        env:
          EMERGENT_API_KEY: ${{ secrets.EMERGENT_API_KEY }}

  build-client:
    runs-on: ubuntu-latest
    env:
      CI: false
    defaults:
      run:
        working-directory: ./client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build